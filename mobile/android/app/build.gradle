plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "dev.flutter.flutter-gradle-plugin"
}

def existingCompanionSources = file("../../../android/app/src/main/java/com/expensetracker/companion")

android {
    namespace "com.expensetracker.mobile"
    compileSdk flutter.compileSdkVersion

    defaultConfig {
        applicationId "com.expensetracker.mobile"
        minSdk 26
        targetSdk flutter.targetSdkVersion
        versionCode flutter.versionCode
        versionName flutter.versionName
    }

    sourceSets {
        main.java.srcDirs += [
            file("${existingCompanionSources}/model"),
            file("${existingCompanionSources}/parser"),
            file("${existingCompanionSources}/notification"),
            file("${existingCompanionSources}/network"),
            file("${existingCompanionSources}/sync"),
        ]
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }
}

flutter {
    source "../.."
}

dependencies {
    implementation "androidx.core:core-ktx:1.15.0"
    implementation "androidx.work:work-runtime-ktx:2.10.0"
}